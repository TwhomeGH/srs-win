
max_connections     1000;
daemon              off;
srs_log_tank        console;

# RTMP server configuration
rtmp {
    listen              1935;
}
http_api {
    enabled         on;
    listen          1985;
    auth {
        enabled         on;
        # Do not ship a default admin/admin password. When username/password
        # are omitted, SRS generates a random initial password in
        # objs/console-auth.txt. Override with SRS_HTTP_API_AUTH_*
        # environment variables in deployments that manage secrets externally.
    }
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
vhost __defaultVhost__ {
}
