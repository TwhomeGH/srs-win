# changelogkit 設定：變更歷史（Docs/ChangeHistory.md）與開發索引。
# 本機用法：python -m changelogkit serve（PYTHONPATH 指向 ChangeLogTools/src）
[tool.changelog]
title    = "SRS-Win 變更歷史"
project  = "SRS-Win"
history  = "Docs/ChangeHistory.md"
todo     = "TODO.md"
# 不索引第三方原始碼與說明文件（避免文件／符號索引被 vendor 內容淹沒）。
exclude  = ["trunk/3rdparty/**", "dev/runtime/**", "ui/node_modules/**", "ui/build/**"]

# Documents 分頁的文件分組。
[[tool.changelog.docs.groups]]
id    = "guide"
title = "建置與使用"
color = "green"
order = 10
paths = ["Docs/建置與執行說明.md", "Docs/VSCode除錯手冊.md", "Docs/文件索引.md", "Docs/Web控制台.md", "Docs/API導讀.md", "Docs/API註解指南.md", "Docs/CI策略.md", "Docs/Phase1結案.md", "Docs/測試策略.md", "Docs/項目概覽說明.md"]

[[tool.changelog.docs.groups]]
id    = "tutorial"
title = "開發教學"
color = "blue"
order = 15
paths = ["Docs/development/tutorial/README.md", "Docs/development/tutorial/01-learn1-build-and-run.md", "Docs/development/tutorial/02-build-configuration.md"]

[[tool.changelog.docs.groups]]
id    = "design"
title = "設計與限制"
color = "violet"
order = 20
paths = ["Docs/Windows移植技術文件.md", "Docs/組件盤點與技術債.md", "Docs/已知限制與待辦事項.md"]

# Doxygen HTML；changelogkit export 時複製到 _site/api-docs/cpp/。
[[tool.changelog.api]]
id    = "cpp"
title = "C++ API"
html  = "build/doxygen/html"
mount = "cpp"
embed = true
order = 10
