# Linux dev config for the Docker lane (upstream ports).
max_connections     1000;
srs_log_tank        console;
daemon              off;

rtmp {
    listen          1935;
}

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8088;
    dir             ./objs/nginx/html;
}

srt_server {
    enabled         on;
    listen          10080;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       127.0.0.1;
}

vhost __defaultVhost__ {
    srt {
        enabled     on;
    }
    rtc {
        enabled     on;
    }
    hls {
        enabled     on;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
