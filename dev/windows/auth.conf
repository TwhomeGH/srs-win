# Dev-only config with HTTP API Basic Auth.
# Keep this file out of production deployments; it uses a fixed demo password.
max_connections     1000;
srs_log_tank        console;
daemon              off;

rtmp {
    listen          11935;
}

http_api {
    enabled         on;
    listen          11985;
    auth {
        enabled     on;
        # Leave username/password unset so SRS generates a random initial password
        # in objs/console-auth.txt. Override with SRS_HTTP_API_AUTH_PASSWORD for dev.
    }
}

http_server {
    enabled         on;
    listen          18088;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    hls {
        enabled     on;
        hls_path    ./objs/nginx/html/hls;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
