# Dev-only Windows config.
# Ports are offset from test.conf so they do not collide with a production
# instance or with services that already own 1985 on this machine.
max_connections     1000;
srs_log_tank        console;
daemon              off;

rtmp {
    listen          11935;
}

http_api {
    enabled         on;
    listen          11985;
}

http_server {
    enabled         on;
    listen          18088;
    dir             ./objs/nginx/html;
}

srt_server {
    enabled         on;
    listen          19980;
}

rtc_server {
    enabled         on;
    listen          19000;
    candidate       127.0.0.1;
}

vhost __defaultVhost__ {
    srt {
        enabled     on;
    }
    rtc {
        enabled     on;
    }
    hls {
        enabled     on;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
