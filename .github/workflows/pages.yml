# 匯出 changelogkit 唯讀靜態站並部署到 GitHub Pages。
# 需先在 repo Settings → Pages → Source 選「GitHub Actions」。
name: "Pages"

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整歷史才能列 commits 與 diff

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 套件尚未上 PyPI，從固定 tag 安裝以確保可重現。
      - name: Install changelogkit
        run: python -m pip install "git+https://github.com/TwhomeGH/ChangeLogKit.git@v0.12.7"

      - name: Export static site
        run: changelogkit --locale zh-TW export _site --branch develop

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
