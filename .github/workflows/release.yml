name: "Release"

on:
  push:
    tags:
      - v1*

permissions:
  contents: write

jobs:
  release:
    name: release-windows-x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate variables
        shell: pwsh
        run: |
          $tag = "${{ github.ref }}".Replace('refs/tags/', '')
          $version = $tag.TrimStart('v')
          echo "SRS_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "SRS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "tag=$tag, version=$version"

      - name: Generate release notes (last ~30 commits)
        shell: pwsh
        run: |
          $tag = "${{ github.ref }}".Replace('refs/tags/', '')
          $prevTag = git tag --sort=-version:refname | Select-Object -Skip 1 | Select-Object -First 1
          if (-not $prevTag) {
            $log = git log --oneline -30
          } else {
            $log = git log --oneline "$prevTag..$tag"
            if (-not $log) { $log = git log --oneline -30 }
          }
          $body = @"
          ## SRS-Win $tag
          Windows native port of SRS streaming server.
          Build with MSVC 2022, x64 Debug.
          $(Get-Date -Format 'yyyy-MM-dd')

          ### Commits
          $($log -join "`n")
          "@
          $body | Out-File -FilePath release_notes.md -Encoding utf8
          echo "Release notes generated."

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          vcpkg install openssl srtp opus srt --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B trunk/ide/srs_msvc/build `
                -S trunk/ide/srs_msvc `
                -G "Visual Studio 17 2022" -A x64 `
                -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build trunk/ide/srs_msvc/build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Smoke test
        shell: pwsh
        run: |
          $SrsExe = "trunk/ide/srs_msvc/build/Release/srs.exe"
          $ConfSrc = "trunk/conf/test.conf"
          if (-not (Test-Path $SrsExe)) { throw "srs.exe not found" }
          $proc = Start-Process -FilePath $SrsExe -ArgumentList "-c `"$ConfSrc`"" -NoNewWindow -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { throw "SRS exited with code $($proc.ExitCode)" }
          try {
            $resp = Invoke-WebRequest -Uri "http://localhost:19850/api/v1/versions" -UseBasicParsing -TimeoutSec 5
            Write-Host "API OK: $($resp.Content)" -ForegroundColor Green
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          $OutDir = "srs-win-${{ env.SRS_VERSION }}"
          New-Item -ItemType Directory -Path $OutDir -Force
          Copy-Item "trunk/ide/srs_msvc/build/Release/srs.exe" $OutDir
          Copy-Item "trunk/ide/srs_msvc/build/Release/*.dll" $OutDir
          Copy-Item "trunk/ide/srs_msvc/build/Release/*.conf" $OutDir
          Copy-Item "Docs/*.md" $OutDir
          Compress-Archive -Path "$OutDir/*" -DestinationPath "$OutDir.zip"
          echo "SRS_PACKAGE=$OutDir.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SRS_TAG }}
          name: Release ${{ env.SRS_TAG }}
          body_path: release_notes.md
          files: ${{ env.SRS_PACKAGE }}
          draft: false
          prerelease: false
