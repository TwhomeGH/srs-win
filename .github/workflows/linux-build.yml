name: "Linux Build"

# Local-first: normal development uses dev/check.ps1 and the Docker dev lane.
# This workflow guards Linux build inputs with path filters, so docs-only or
# Windows-only changes do not consume a runner.
on:
  # Run when Linux build inputs change, and on demand. There is no
  # unconditional weekly schedule: a clean weekly run with no new commit only
  # burns a runner and does not prove a new code path.
  push:
    branches: [develop]
    paths:
      - 'trunk/src/**'
      - 'trunk/configure'
      - 'trunk/auto/**'
      - 'trunk/Makefile'
      - 'trunk/3rdparty/**'
      - 'dev/check-source-lists.ps1'
      - '.github/workflows/linux-build.yml'
  pull_request:
    paths:
      - 'trunk/src/**'
      - 'trunk/configure'
      - 'trunk/auto/**'
      - 'trunk/Makefile'
      - 'trunk/3rdparty/**'
      - 'dev/check-source-lists.ps1'
      - '.github/workflows/linux-build.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: linux-build
  cancel-in-progress: true

jobs:
  build-linux:
    name: build-linux-x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libsrtp2-dev \
            libsrt-openssl-dev \
            libopus-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            unzip \
            automake \
            libtool \
            patch \
            git \
            tcl

      - name: Check source lists
        shell: pwsh
        run: ./dev/check-source-lists.ps1

      - name: Configure (system libraries)
        working-directory: trunk
        run: |
          ./configure \
            --jobs="$(nproc)" \
            --use-sys-srtp=on \
            --use-sys-srt=on \
            --use-sys-ffmpeg=on

      - name: Build
        working-directory: trunk
        run: make -j"$(nproc)"

      - name: Verify binary
        working-directory: trunk
        run: |
          test -x ./objs/srs
          ./objs/srs -v
