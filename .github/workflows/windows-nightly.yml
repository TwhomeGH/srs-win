name: "Windows Nightly"

# Local-first: normal development uses dev/check.ps1, dev/srs-dev.ps1 and
# dev/local-deploy.ps1. This workflow is the stable nightly channel, not a
# per-push build gate. Use workflow_dispatch for an on-demand build.
on:
  schedule:
    # 03:00 Asia/Taipei (UTC+8).
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: windows-nightly
  cancel-in-progress: true

jobs:
  # A scheduled run still needs a reason to burn a Windows runner. Build only
  # when develop has moved since the last successful nightly, or when a human
  # explicitly dispatches the workflow.
  gate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check for changes since last successful nightly
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('changed', 'true');
              core.info('Manual dispatch: build unconditionally.');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'windows-nightly.yml',
              branch: 'develop',
              status: 'success',
              per_page: 1
            });
            const last = data.workflow_runs[0];
            const changed = !last || last.head_sha !== context.sha;
            core.info(`last=${last ? last.head_sha : 'none'} current=${context.sha} changed=${changed}`);
            core.setOutput('changed', String(changed));

  build-windows:
    name: build-windows-x64
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B trunk/ide/srs_msvc/build `
                -S trunk/ide/srs_msvc `
                -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build trunk/ide/srs_msvc/build --config Release --verbose *> build.log
          $exitCode = $LASTEXITCODE
          Get-Content build.log
          if ($exitCode -ne 0) { throw "Build failed, see build.log artifact" }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: st event loop test
        shell: pwsh
        run: |
          ctest --test-dir trunk/ide/srs_msvc/build -C Release -R 'st-event-loop-test|path-rename-test|file-share-test|win-compat-test' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "native tests failed" }

      - name: Platform contract (PID lock)
        shell: pwsh
        run: |
          pwsh dev/test-platform-contract.ps1 -SrsExe trunk/ide/srs_msvc/build/Release/srs.exe
          if ($LASTEXITCODE -ne 0) { throw "platform contract failed" }

      - name: Install web console deps
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: Test web console
        working-directory: ui
        run: npm test

      - name: Build web console
        working-directory: ui
        run: npm run build

      - name: Install web console
        shell: pwsh
        run: |
          $dst = "trunk/ide/srs_msvc/build/Release/objs/nginx/html/console"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "ui/build/*" $dst -Recurse -Force

      - name: Smoke test
        shell: pwsh
        run: |
          pwsh dev/smoke-test.ps1 `
            -SrsExe trunk/ide/srs_msvc/build/Release/srs.exe `
            -ConfFile trunk/ide/srs_msvc/build/Release/test.conf `
            -WorkDir trunk/ide/srs_msvc/build/Release `
            -CheckConsole

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: srs-win-nightly-x64
          path: |
            trunk/ide/srs_msvc/build/Release/srs.exe
            trunk/ide/srs_msvc/build/Release/*.conf
            trunk/ide/srs_msvc/build/Release/*.dll
            trunk/ide/srs_msvc/build/Release/objs/nginx/html/console/**
          retention-days: 14

