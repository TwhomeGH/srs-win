name: "Windows Nightly"

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: read-all

jobs:
  build-windows:
    name: build-windows-x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B trunk/ide/srs_msvc/build `
                -S trunk/ide/srs_msvc `
                -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build trunk/ide/srs_msvc/build --config Debug --verbose *> build.log
          $exitCode = $LASTEXITCODE
          Get-Content build.log
          if ($exitCode -ne 0) { throw "Build failed, see build.log artifact" }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Smoke test
        shell: pwsh
        run: |
          $SrsExe = "trunk/ide/srs_msvc/build/Debug/srs.exe"
          $ConfSrc = "trunk/conf/test.conf"
          if (-not (Test-Path $SrsExe)) { throw "srs.exe not found" }
          Remove-Item -Path "objs/srs.pid" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path objs -Force | Out-Null
          $proc = Start-Process -FilePath $SrsExe -ArgumentList "-c `"$ConfSrc`"" -NoNewWindow -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) { throw "SRS exited with code $($proc.ExitCode)" }
          try {
            $resp = Invoke-WebRequest -Uri "http://localhost:1985/api/v1/versions" -UseBasicParsing -TimeoutSec 15
            Write-Host "API OK: $($resp.Content)" -ForegroundColor Green
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srs-win-x64-debug
          path: |
            trunk/ide/srs_msvc/build/Debug/srs.exe
            trunk/ide/srs_msvc/build/Debug/srs.pdb
            trunk/ide/srs_msvc/build/Debug/*.conf
            trunk/ide/srs_msvc/build/Debug/*.dll
          retention-days: 7
