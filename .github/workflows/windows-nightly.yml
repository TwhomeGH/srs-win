name: "Windows Nightly"

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: read-all

jobs:
  build-windows:
    name: build-windows-x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B trunk/ide/srs_msvc/build `
                -S trunk/ide/srs_msvc `
                -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build trunk/ide/srs_msvc/build --config Debug --verbose *> build.log
          $exitCode = $LASTEXITCODE
          Get-Content build.log
          if ($exitCode -ne 0) { throw "Build failed, see build.log artifact" }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: st event loop test
        shell: pwsh
        run: |
          ctest --test-dir trunk/ide/srs_msvc/build -C Debug -R st-event-loop-test --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "st event loop test failed" }

      - name: Build web console
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install web console
        shell: pwsh
        run: |
          $dst = "trunk/ide/srs_msvc/build/Debug/objs/nginx/html/console"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "ui/build/*" $dst -Recurse -Force

      - name: Smoke test
        shell: pwsh
        run: |
          $SrsExe = (Resolve-Path "trunk/ide/srs_msvc/build/Debug/srs.exe").Path
          $WorkDir = (Resolve-Path "trunk/ide/srs_msvc/build/Debug").Path
          $ConfFile = Join-Path $WorkDir "test.conf"
          if (-not (Test-Path $ConfFile)) { throw "test.conf not found" }
          Remove-Item -Path (Join-Path $WorkDir "objs/srs.pid") -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $WorkDir "objs") -Force | Out-Null
          $proc = Start-Process -FilePath $SrsExe -ArgumentList "-c `"test.conf`"" -WorkingDirectory $WorkDir -NoNewWindow -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) { throw "SRS exited with code $($proc.ExitCode)" }
          try {
            $resp = Invoke-WebRequest -Uri "http://localhost:1985/api/v1/versions" -UseBasicParsing -TimeoutSec 15
            Write-Host "API OK: $($resp.Content)" -ForegroundColor Green

            # RTMP handshake: 1537-byte C0+C1, expect 16-byte S0+S1 in reply.
            $tcp = New-Object System.Net.Sockets.TcpClient
            $tcp.Connect('127.0.0.1', 19350)
            $tcp.ReceiveTimeout = 15000
            $stream = $tcp.GetStream()
            $handshake = New-Object byte[] 1537
            $handshake[0] = 3
            (New-Object System.Random).NextBytes($handshake)
            $handshake[0] = 3
            $stream.Write($handshake, 0, $handshake.Length)
            $reply = New-Object byte[] 16
            $read = $stream.Read($reply, 0, $reply.Length)
            $tcp.Close()
            if ($read -ne 16) { throw "RTMP handshake returned $read bytes, expected 16" }
            Write-Host "RTMP handshake OK: $read bytes" -ForegroundColor Green

            $console = Invoke-WebRequest -Uri "http://localhost:1985/console/" -UseBasicParsing -TimeoutSec 15
            if ($console.StatusCode -ne 200) { throw "console returned $($console.StatusCode)" }
            Write-Host "Console OK: /console/" -ForegroundColor Green
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srs-win-x64-debug
          path: |
            trunk/ide/srs_msvc/build/Debug/srs.exe
            trunk/ide/srs_msvc/build/Debug/srs.pdb
            trunk/ide/srs_msvc/build/Debug/*.conf
            trunk/ide/srs_msvc/build/Debug/*.dll
            trunk/ide/srs_msvc/build/Debug/objs/nginx/html/console/**
          retention-days: 7
